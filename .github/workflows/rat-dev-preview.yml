name: Rat dev preview

on:
  push:
    branches: ['dev']

jobs:
  build:
    name: Build dev preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build app
        env:
          CINNY_BASE: /void/rat-dev/
          NODE_OPTIONS: '--max_old_space_size=3072'
        run: npm run build
      - name: Set background scene tier
        run: node scripts/preview-config.js low
      - name: Upload artifact
        # Forgejo's fork: upstream upload-artifact v4+ refuses non-GitHub servers (GHESNotSupportedError).
        uses: forgejo/upload-artifact@v4
        env:
          ACTIONS_RESULTS_URL: https://eureka.gamecult.org/forge/
        with:
          name: rat-dev-dist
          path: dist
          retention-days: 3
